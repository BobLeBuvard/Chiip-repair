<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Console Service - Accueil</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; background-color: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; }
    .pack-options { display: flex; justify-content: space-around; margin-top: 40px; }
    .pack { border: 1px solid #ddd; border-radius: 8px; padding: 20px; text-align: center; width: 45%; cursor: pointer; transition: all 0.3s; }
    .pack:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .pack-simple { background-color: #e8f5e9; }
    .pack-avance { background-color: #e3f2fd; }
    .pack h2 { margin-top: 0; }
    .pack p { font-size: 1.1em; }
    .price { font-weight: bold; font-size: 1.2em; color: #d32f2f; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Console Service - Service de Modding</h1>
    <p>Choisissez le type de pack qui correspond à vos besoins :</p>
    
    <div class="pack-options">
      <div class="pack pack-simple" onclick="location.href='pack-simple.html'">
        <h2>Pack Simple</h2>
        <p>Modding complet avec garantie</p>
        <p class="price">À partir de 50€</p>
      </div>
      
      <div class="pack pack-avance" onclick="location.href='pack-avance.html'">
        <h2>Pack Avancé</h2>
        <p>Options personnalisables</p>
        <p class="price">À partir de 20€</p>
      </div>
    </div>
  </div>
</body>
</html>
