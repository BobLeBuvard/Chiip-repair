<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Console Service - Pack Simple</title>
  <script src="config.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; background-color: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; }
    .model-selection { margin: 20px 0; }
    .model-option { display: inline-block; margin-right: 20px; text-align: center; cursor: pointer; }
    .model-option input { display: none; }
    .model-option img { width: 150px; height: auto; border: 2px solid transparent; border-radius: 8px; transition: all 0.3s; }
    .model-option input:checked + img { border-color: #2196F3; box-shadow: 0 0 10px rgba(33, 150, 243, 0.5); }
    .model-name { margin-top: 5px; font-weight: bold; }
    .price-info { margin: 20px 0; font-size: 1.2em; }
    .price { font-weight: bold; color: #d32f2f; }
    .action-buttons { margin-top: 30px; text-align: center; }
    button { padding: 10px 20px; margin: 0 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; }
    .btn-primary { background-color: #2196F3; color: white; }
    .btn-secondary { background-color: #f5f5f5; color: #333; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pack Simple - Console Service</h1>
    <p>Le pack simple comprend le modding complet de votre console avec garantie.</p>
    
    <div class="model-selection">
      <h2>Sélectionnez votre modèle de console :</h2>
      <label class="model-option">
        <input type="radio" name="console-model" value="Lite" checked onchange="updatePrice()">
        <img src="lite.png" alt="Switch Lite" onerror="this.src='https://via.placeholder.com/150?text=Lite'">
        <div class="model-name">Switch Lite</div>
      </label>
      
      <label class="model-option">
        <input type="radio" name="console-model" value="Normale" onchange="updatePrice()">
        <img src="regular.png" alt="Switch Regular" onerror="this.src='https://via.placeholder.com/150?text=Regular'">
        <div class="model-name">Switch Regular</div>
      </label>
      
      <label class="model-option">
        <input type="radio" name="console-model" value="Oled" onchange="updatePrice()">
        <img src="oled.png" alt="Switch OLED" onerror="this.src='https://via.placeholder.com/150?text=OLED'">
        <div class="model-name">Switch OLED</div>
      </label>
    </div>
    
    <div class="price-info">
      <p>Prix du service : <span id="price" class="price">60</span> €</p>
      <p>Durée estimée : <span id="duration">90</span> minutes</p>
    </div>
    
    <div class="action-buttons">
      <button class="btn-secondary" onclick="location.href='index.html'">Retour</button>
      <button class="btn-primary" onclick="proceedToTimeSelection()">Voir les plages horaires disponibles</button>
    </div>
  </div>

  <script>
    function updatePrice() {
      const model = document.querySelector('input[name="console-model"]:checked').value;
      let price = CONFIG.prices[model].base;
      let duration = 90; // Durée fixe pour pack simple
      
      document.getElementById('price').textContent = price;
      document.getElementById('duration').textContent = duration;
    }
    
    function proceedToTimeSelection() {
      const model = document.querySelector('input[name="console-model"]:checked').value;
      const price = document.getElementById('price').textContent;
      const duration = document.getElementById('duration').textContent;
      
      // CORRECTION : Bien sauvegarder les données pour pack simple
      const reservationData = {
        packType: 'simple',
        consoleModel: model,
        price: price,
        duration: parseInt(duration),
        consolesCount: 1,
        totalPrice: price
      };
      
      // Sauvegarder toutes les données nécessaires
      localStorage.setItem('packType', 'simple');
      localStorage.setItem('consoleModel', model);
      localStorage.setItem('price', price);
      localStorage.setItem('duration', duration);
      localStorage.setItem('consolesCount', '1');
      localStorage.setItem('totalPrice', price);
      localStorage.setItem('totalDuration', duration);
      localStorage.setItem('reservationData', JSON.stringify(reservationData));
      
      console.log('Données sauvegardées:', reservationData);
      
      // Rediriger vers la page de sélection des plages horaires
      location.href = 'plages-horaires.html';
    }
    
    // Initialiser le prix au chargement
    updatePrice();
  </script>
</body>
</html>
